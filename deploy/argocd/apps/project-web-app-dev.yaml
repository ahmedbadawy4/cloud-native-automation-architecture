apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: web-app-dev
  namespace: argocd
  annotations:
    # Create the project before the application that uses it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Dev applications for cloud-native-automation-architecture
  sourceRepos:
    - https://github.com/ahmedbadawy4/cloud-native-automation-architecture.git
  destinations:
    - namespace: web-app-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
